<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>精选 · 智能协同安全研究情报站</title><meta name="description" content="跟踪智能系统与人协作时的安全、可靠性和效率。当前重点关注自动驾驶与人形机器人，精选研究论文、政策、现场案例和国内外团队的公开进展。"><meta name="edition" content="8fb3a8e7b506111a"><link rel="icon" href="./mark.svg"><link rel="stylesheet" href="./app.css?v=4b3c80b73ee39ffc"><script type="module" src="./app.js?v=e2aa9172dc99c30b"></script></head><body><div id="app"></div><noscript><main><h1>精选 · 智能协同安全研究情报站</h1><article><h2><a href="https://arxiv.org/abs/2611.27638">驾驶模型能说清危险，它真的会改道吗？</a></h2><p>研究者固定 Drive-JEPA 规划器，让视觉语言模型提出可检查的场景事实，再剔除与事实矛盾的候选轨迹。在 NAVHARD 测试上，这种做法比原始规划器高 2.4 个 EPDMS 分数点。与采用同等干预的对照组相比，高出的 2.0 分仍有统计不确定性。</p><p>如果要让语言模型参与开车，应追问它改变了哪一次轨迹选择。这篇论文给出了能复查的对照实验，也解释了为什么口头解释流畅不足以证明驾驶更安全。</p></article><article><h2><a href="https://arxiv.org/abs/2611.27447">仿真路口看起来够真，自动驾驶感知就能测准吗？</a></h2><p>研究者把真实道路与对应仿真场景配对，在十种生成方法、三套冻结的感知系统上，检查预测背后的视觉证据。两张图看起来相似、模型给出相同答案，都不能稳定预测模型是否依赖同样的线索。</p><p>这直接影响仿真里程该算多少安全证据。读论文时可以对照它怎样检验感知依据，以及这套诊断能覆盖哪些场景。实验没有测量上路后的事故率。</p></article><article><h2><a href="https://arxiv.org/abs/2611.27327">人打断对话时，人形机器人的手势能跟上吗？</a></h2><p>EIP 把语音交互和动作生成放进同一套流式模型。团队针对宇树 G1 和星尘 S1 适配动作，并在实机与用户研究中评估自然度和舒适度。与论文选取的一套串联系统相比，模型预热后的响应延迟缩短了 64%。</p><p>在导览或接待场景，响应快慢、能否被打断直接影响协作效率。原文分别报告时延和用户感受；64% 描述的是特定对照的时延，用它推算碰撞风险没有依据。</p></article><article><h2><a href="https://arxiv.org/abs/2611.27182">人突然走进机器人作业区，什么时候该中断动作？</a></h2><p>Tripwire 让上层控制器在执行动作前写下中断条件。研究者在 168 个含人类干扰的仿真场景中测试了四种策略。表现最强的策略避免接触的比例从 61.3% 升至 81.3%，任务完成率从 31.0% 升至 38.7%。</p><p>值得看两个指标能否一起改善。停得多也可能做不完任务，这项实验同时测了接触和完成率。它给出了一种评测人机共处的方法，真机与真人能否复现仍待验证。</p></article><article><h2><a href="https://arxiv.org/abs/2611.26444">机器人想对了却没做成，怎样分清推理和执行的责任？</a></h2><p>Mind2Act World 在 30 个模拟操作任务、180 种配置里，分别测需要记住前情的推理、精确执行动作，以及把两者串在一起的表现。分别能推理、能动作的策略，在连续执行时仍会失手。</p><p>适合拿来检查具身模型的失败归因。论文把历史记忆、手上动作和二者配合拆开测，能帮助团队判断该改规划器还是执行策略。结论来自仿真操作任务。</p></article><article><h2><a href="https://waymo.com/blog/2026/11/winter-weather-preparedness/">暴雪来时，Waymo 怎么决定哪些路继续接单？</a></h2><p>Waymo 公开了冬季运营做法。车队结合车辆观察到的路况、天气信息和运营团队判断调整服务范围，恶劣天气下可缩小或暂停服务。</p><p>值得看的是从发现风险到收缩运营范围的决策过程。文章出自运营方，能说明它怎样做决策。评估措施的实际效果，还需要按天气和行驶里程拆分的事故数据。</p></article><article><h2><a href="https://www.ntsb.gov/news/press-releases/Pages/NR20261027.aspx">岸上有人监控，无人船为何仍会相撞？</a></h2><p>美国国家运输安全委员会发布了对 2024 年一起无人船碰撞事故的调查结果，并提出六项安全建议。涉事无人船在自动保持航点时，岸上操作者的被动监控未能及时发现危险。</p><p>想研究远程接管，可以从这份调查找一个具体问题：当前自动化模式下，谁有足够的信息和时间主动干预？案例发生在水上，可用于对照无人车远程协助的职责设计。</p></article><article><h2><a href="https://arxiv.org/abs/2610.20579">两台人形机器人同打一张乒乓球台，怎么给队友让位？</a></h2><p>PingpongDuo 把击球和避让放进同一个双人任务。两台实体机器人在有限空间里交替回击，连续完成了十多次击球。论文还在仿真中比较了协作策略的回球成功率。</p><p>这项实验把人形机器人的协同落实到可以数的连续回合，也暴露了共享空间的避让问题。实验搭档都是机器人，真人混合作业的安全距离仍需另行验证。</p></article><article><h2><a href="https://arxiv.org/abs/2609.21130">两台人形机器人和一名真人协作，怎样同时测安全与完成率？</a></h2><p>SAGE 在两台人形机器人与一名真人的实验中演示了协作，并在九种仿真场景测量成功率与碰撞。在一项消融对照中，直接加安全过滤器让碰撞频率降低 98.5%，同时使任务成功率从 67.3% 降到 59.3%。</p><p>想评估人机协同，这组反向变化值得看。可解释的动作选择、安全过滤器实际执行的动作、最终完成的任务是三个不同环节。论文的降碰撞数字来自仿真；真机部分验证了可部署性。</p></article><article><h2><a href="https://www.gov.uk/government/speeches/new-consultation-on-draft-statutory-statement-of-safety-principles-for-automated-vehicles">自动驾驶要和谁比安全？英国草案选了谨慎、称职的人类驾驶员</a></h2><p>英国交通部就自动驾驶车辆法定安全原则草案征求意见，列出十项原则，包括与谨慎、称职的人类驾驶员比较，以及对行人、骑行者等易受伤害者的保护。咨询已结束，文中原则的状态仍是征求意见稿。</p><p>如果把平均驾驶员、谨慎驾驶员或某段道路的历史表现当作基准，同一套系统可能得出不同结论。草案把参照人群写明，适合与企业安全报告的统计口径对读。</p></article></main></noscript></body></html>
